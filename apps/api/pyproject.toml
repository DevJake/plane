[project]
name = "plane-api"
version = "0.24.0"
description = "Open-source project management that unlocks customer value"
requires-python = "==3.14.*"
dependencies = [
    "beautifulsoup4==4.15.0",
    "boto3==1.43.62",
    "celery==5.6.3",
    "channels==4.3.2",
    "cryptography==50.0.0",
    "dj-database-url==3.1.2",
    "django==6.0.7",
    "django-celery-beat==2.9.0",
    "django-celery-results==2.6.0",
    "django-cors-headers==4.9.0",
    "django-crum==0.7.9",
    "django-filter==26.1",
    "django-redis==7.0.0",
    "django-storages==1.14.6",
    "djangorestframework==3.17.1",
    "drf-spectacular==0.30.0",
    "faker==40.36.0",
    "gunicorn==26.0.0",
    "jsonmodels==2.8.0",
    "lxml==6.1.1",
    "nh3==0.3.6",
    "openai==2.52.0",
    "openpyxl==3.1.5",
    "opentelemetry-api==1.44.0",
    "opentelemetry-exporter-otlp==1.44.0",
    "opentelemetry-exporter-otlp-proto-grpc==1.44.0",
    "opentelemetry-instrumentation-django==0.65b0",
    "opentelemetry-sdk==1.44.0",
    "posthog==7.35.4",
    "psycopg==3.3.4",
    "psycopg-binary==3.3.4",
    "psycopg-c==3.3.4",
    "pyjwt==2.13.0",
    "python-json-logger==4.1.0",
    "pytz==2026.3.post1",
    "redis==8.1.0",
    "requests==2.34.2",
    "scout-apm==3.5.3",
    "slack-sdk==3.43.0",
    "urllib3==2.7.0",
    "uvicorn==0.52.0",
    "whitenoise==6.12.0",
    "zxcvbn==4.5.0",
]

[dependency-groups]
local = [
    "django-debug-toolbar==7.0.0",
    "ruff==0.16.1",
]
test = [
    "coverage==7.15.2",
    "factory-boy==3.3.3",
    "freezegun==1.5.5",
    "httpx==0.28.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-django==4.12.0",
    "pytest-mock==3.15.1",
    "pytest-xdist==3.8.0",
]

[tool.uv]
default-groups = ["local"]
package = false
required-version = "==0.12.1"

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "**/migrations/*",
]

# Same as Black.
line-length = 120
indent-width = 4

[tool.ruff.format]
# Use double quotes for strings.
quote-style = "double"

# Indent with spaces, rather than tabs.
indent-style = "space"

# Respect magic trailing commas.
# skip-magic-trailing-comma = true

# Automatically detect the appropriate line ending.
line-ending = "auto"

[tool.ruff.lint]
# Enable pycodestyle (`E`) and Pyflakes (`F`) codes by default.
select = ["E", "F"]
ignore = []

# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.pep8-naming]
# Allow lowercase variables like "id"
classmethod-decorators = ["classmethod", "validator", "root_validator"]

[tool.ruff.lint.per-file-ignores]
# Ignore specific rules for tests
"tests/*" = ["E402", "F401", "F811"]
# Ignore imported but unused in __init__.py files
"__init__.py" = ["F401"]

[tool.ruff.lint.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10

[tool.ruff.lint.isort]
combine-as-imports = true
detect-same-package = true
force-wrap-aliases = true
known-first-party = ["plane"]
known-third-party = ["rest_framework"]
relative-imports-order = "closest-to-furthest"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.pycodestyle]
ignore-overlong-task-comments = true
max-doc-length = 88

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 8
max-statements = 50
